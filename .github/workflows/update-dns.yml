name: Update Cloudflare DNS

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run update script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_RECORD: ${{ secrets.CF_RECORD }}
          CF_PROXY: ${{ secrets.CF_PROXY }}
          CF_TARGET: ${{ secrets.CF_TARGET }}
        run: python update_dns.py

      - name: Clean up old logs (keep last 30 days)
        if: always()
        run: find log/ -type f -mtime +30 -delete 2>/dev/null || true

      - name: Commit logs back to repo
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log/
          if git diff --cached --quiet; then
            echo "No log changes to commit"
          else
            git commit -m "chore: 更新日志 $(date +'%Y-%m-%d %H:%M')"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: update-logs
          path: log/
          if-no-files-found: ignore
